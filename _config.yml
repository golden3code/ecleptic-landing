# GitHub Pages (Jekyll) : fichiers du dépôt à NE PAS publier sur ecleptic.health.
# Les outils de build et les articles programmés (tools/satellites) restaient
# servis publiquement — ils ne doivent exister que dans le dépôt.
exclude:
  - tools
  - discord-kit.md
  - README.md
  - "*.py"
  - "*.json"

# Liens universels (réseau social, phase 0, lot E3) : Jekyll ignore les
# dossiers qui commencent par un point, et « *.json » est exclu plus haut.
# include passe avant exclude : apple-app-site-association et assetlinks.json
# sont publiés sous /.well-known/.
include:
  - .well-known
  - .well-known/apple-app-site-association
  - .well-known/assetlinks.json
  # GitHub Pages (Jekyll 3) compare « include » au seul nom du fichier : sans
  # cette ligne, « *.json » l'emporte et le fichier répond 404.
  - assetlinks.json
