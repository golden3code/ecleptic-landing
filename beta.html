<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ecleptic — iOS Beta</title>
<meta name="description" content="Ecleptic aligns your sleep, nutrition and training into one score. Join the TestFlight beta.">
<meta property="og:title" content="Ecleptic — Everything aligns.">
<meta property="og:description" content="Sleep, nutrition, training: one score, one coach that understands it all. iOS beta open.">
<meta property="og:type" content="website">
<style>
  :root{
    --gold:#D9A441; --gold-soft:#B07A2A; --ink:#F2EBDD; --muted:#9A8E77;
    --bg:#0B0A08; --card:#161310; --line:#2A241B;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px}
  .langbar{display:flex;justify-content:flex-end;gap:4px;padding:16px 24px 0;max-width:960px;margin:0 auto}
  .langbar button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;
                  padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600}
  .langbar button.on{background:var(--gold);border-color:var(--gold);color:#1C1710}
  header{padding:32px 0 8px;text-align:center}
  .logo{font-size:15px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-weight:600}
  h1{font-size:clamp(30px,6vw,48px);font-weight:700;letter-spacing:-.02em;margin:20px 0 0}
  h1 em{font-style:normal;color:var(--gold)}
  .pitch{max-width:560px;margin:18px auto 0;color:var(--muted);font-size:clamp(16px,2.5vw,19px)}
  .cta{display:inline-block;border:0;cursor:pointer;margin:32px auto 8px;background:var(--gold);color:#1C1710;text-decoration:none;
       padding:16px 34px;border-radius:14px;font-size:17px;font-weight:600;box-shadow:0 8px 24px rgba(217,164,65,.18)}
  .cta:active{transform:translateY(1px)}
  .cta-note{font-size:13px;color:var(--muted);margin-top:10px}
  .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:40px 0 8px}
  @media(max-width:640px){.shots{grid-template-columns:1fr;max-width:320px;margin-left:auto;margin-right:auto}}
  .shot{position:relative;aspect-ratio:9/19.5;border-radius:28px;background:var(--card);border:1px solid var(--line);
        overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  footer{border-top:1px solid var(--line);padding:24px 0 48px;text-align:center;color:var(--muted);font-size:13px}
  footer a{color:var(--muted)}
  .disclaimer{max-width:620px;margin:10px auto 0}

  /* Questionnaire */
  #quiz{max-width:560px;margin:24px auto 56px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:left}
  #quiz h2{font-size:19px;margin-bottom:4px}
  #quiz .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .q{margin-bottom:20px}
  .q label.title{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
  .q small{font-weight:400;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips input{position:absolute;opacity:0;pointer-events:none}
  .chips span{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
              background:var(--bg);font-size:14px;color:var(--ink);cursor:pointer;user-select:none}
  .chips input:checked + span{background:var(--gold);border-color:var(--gold);color:#1C1710;font-weight:600}
  input[type=text],input[type=email]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
              font-size:16px;background:var(--bg);color:var(--ink)}
  input:focus{outline:2px solid var(--gold-soft)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  .submit{width:100%;margin:6px 0 0}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center}
  #done{display:none;max-width:560px;margin:24px auto 56px;background:var(--card);border:1px solid var(--line);
        border-radius:20px;padding:36px 28px;text-align:center}
  #done h2{font-size:22px;margin-bottom:8px}
  #done p{color:var(--muted);font-size:15px;margin-bottom:6px}
  .err{display:none;color:#E07A50;font-size:14px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="langbar">
  <button id="lang-en" class="on" type="button">EN</button>
  <button id="lang-fr" type="button">FR</button>
</div>

<div id="home">
<header class="wrap">
  <div class="logo">Ecleptic</div>
  <h1 id="t-title"></h1>
  <p class="pitch" id="t-pitch"></p>
</header>
<div class="wrap">
  <div class="shots">
    <div class="shot"><img src="shots/1.png" alt="Ecleptic home screen" onerror="this.remove()"><span id="t-shot1"></span></div>
    <div class="shot"><img src="shots/2.png" alt="Ecleptic nutrition screen" onerror="this.remove()"><span id="t-shot2"></span></div>
    <div class="shot"><img src="shots/3.png" alt="Ecleptic Lab screen" onerror="this.remove()"><span id="t-shot3"></span></div>
  </div>
  <div style="text-align:center;margin-bottom:56px">
    <a class="cta" id="goQuiz" href="#quiz"></a>
    <p class="cta-note" id="t-ctanote"></p>
    <p id="spots" hidden style="margin-top:14px;display:inline-block;border:1px solid var(--gold);color:var(--gold);
       border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600"></p>
  </div>
</div>
</div>

  <form id="quiz" hidden>
    <h2 id="t-qtitle"></h2>
    <p class="sub" id="t-qsub"></p>

      <div>
        <label class="title" for="first_name" id="t-firstname"></label>

      </div>
      <div>
        <label class="title" for="email" id="t-email"></label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
    </div>

    <div class="q">
      <label class="title" id="t-watch"></label>
      <div class="chips">
        <label><input type="radio" name="has_apple_watch" value="apple_watch" required><span>Apple Watch</span></label>
        <label><input type="radio" name="has_apple_watch" value="autre_montre"><span id="t-watch-other"></span></label>
        <label><input type="radio" name="has_apple_watch" value="aucune"><span id="t-watch-none"></span></label>
      </div>
    </div>

    <div class="q">
      <label class="title" id="t-freq"></label>
      <div class="chips">
        <label><input type="radio" name="training_frequency" value="0-2" required><span>0–2</span></label>

      </div>
    </div>

    <div class="q">
      <label class="title"><span id="t-sports"></span> <small id="t-multi1"></small></label>

        <label><input type="checkbox" name="sports" value="sports_co"><span id="t-s-co"></span></label>
        <label><input type="checkbox" name="sports" value="combat"><span id="t-s-combat"></span></label>
        <label><input type="checkbox" name="sports" value="crossfit"><span>CrossFit / Hyrox</span></label>
        <label><input type="checkbox" name="sports" value="autre"><span id="t-s-autre"></span></label>
      </div>
    </div>

    <div class="q">
      <label class="title"><span id="t-apps"></span> <small id="t-multi2"></small></label>
      <div class="chips">
        <label><input type="checkbox" name="apps_used" value="whoop"><span>Whoop</span></label>
        <label><input type="checkbox" name="apps_used" value="mfp"><span>MyFitnessPal / Yazio</span></label>

        <label><input type="checkbox" name="apps_used" value="strava"><span>Strava</span></label>
        <label><input type="checkbox" name="apps_used" value="apple_sante"><span id="t-a-health"></span></label>
        <label><input type="checkbox" name="apps_used" value="aucune"><span id="t-a-none"></span></label>
      </div>
    </div>

    <div class="q">
      <label class="title" id="t-goal"></label>
      <div class="chips">
        <label><input type="radio" name="main_goal" value="perf" required><span id="t-g-perf"></span></label>
        <label><input type="radio" name="main_goal" value="masse"><span id="t-g-masse"></span></label>
        <label><input type="radio" name="main_goal" value="perte"><span id="t-g-perte"></span></label>
        <label><input type="radio" name="main_goal" value="sommeil"><span id="t-g-sommeil"></span></label>
        <label><input type="radio" name="main_goal" value="sante"><span id="t-g-sante"></span></label>
      </div>
    </div>

    <div class="q">
      <label class="title" id="t-source"></label>
      <div class="chips">
        <label><input type="radio" name="source" value="reddit" required><span>Reddit</span></label>
        <label><input type="radio" name="source" value="instagram"><span>Instagram</span></label>
        <label><input type="radio" name="source" value="tiktok"><span>TikTok</span></label>
        <label><input type="radio" name="source" value="threads"><span>Threads</span></label>
        <label><input type="radio" name="source" value="ami"><span id="t-src-friend"></span></label>
        <label><input type="radio" name="source" value="autre"><span id="t-src-other"></span></label>
      </div>
    </div>

    <button class="cta submit" type="submit" id="submitBtn"></button>
    <p class="err" id="err"></p>
    <p class="hint"><span id="t-hint"></span> <a href="confidentialite.html" style="color:var(--muted)" id="t-privacy"></a></p>
  </form>

  <div id="done">
    <h2><span id="t-welcome"></span> <span id="doneName"></span> ✦</h2>
    <p id="t-step1"></p>
    <p id="t-step2"></p>
    <a class="cta" id="tfLink" href="https://testflight.apple.com/join/H5CQgDa7"></a>
    <div style="margin-top:18px;text-align:left;border:1px solid var(--gold);border-radius:14px;padding:14px 16px">
      <p style="color:var(--gold);font-weight:600;margin-bottom:6px" id="t-tips-title"></p>
      <p id="t-tip-golden"></p>
      <p id="t-tip-lang"></p>
    </div>
    <p style="margin-top:14px" id="t-step3"></p>
  </div>
</main>

<footer class="wrap">
  <a href="confidentialite.html" id="t-privacy2"></a> · <a href="mailto:contact@ecleptic.app">Contact</a>
  <p class="disclaimer" id="t-disclaimer"></p>
</footer>

    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 8000) : null;
    try {
      var res = await fetch(SUPABASE_URL + "/rest/v1/beta_testers", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY,
                   "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Prefer": "return=minimal" },
        body: JSON.stringify(payload),
        signal: ctrl ? ctrl.signal : undefined
      });
      return { ok: res.ok || res.status === 409, detail: "http_" + res.status };
    } catch(ex) {
      return { ok: false, detail: (ex && ex.name) || "fetch_error" };
    } finally { if (timer) clearTimeout(timer); }
  }

  // Insert avec 1 retry ; en cas d'échec, le payload est gardé en localStorage
  // et retenté silencieusement au prochain chargement (on ne perd pas l'email).
  var PENDING_KEY = "ecleptic.pendingSignup";
  async function saveTester(payload){
    if (!(SUPABASE_URL && SUPABASE_ANON_KEY)) return { ok: true, detail: "no_keys" };
    var r = await tryInsert(payload);
    if (!r.ok) r = await tryInsert(payload);
    if (r.ok) { try { localStorage.removeItem(PENDING_KEY); } catch(_){} }
    else { try { localStorage.setItem(PENDING_KEY, JSON.stringify(payload)); } catch(_){} }
    return r;
  }
  (async function flushPending(){
    var raw = null;
    try { raw = localStorage.getItem(PENDING_KEY); } catch(_) {}
    if (!raw) return;
    try {
      var r = await saveTester(JSON.parse(raw));
      if (r.ok) track("beta_form_recovered");
    } catch(_) {}
  })();

  var form = document.getElementById("quiz");
  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var btn = document.getElementById("submitBtn");
    btn.disabled = true; btn.textContent = I18N[LANG].submitting;

    var fd = new FormData(form);
    var payload = {
      first_name: fd.get("first_name"),
      email: (fd.get("email")||"").trim().toLowerCase(),
      has_apple_watch: fd.get("has_apple_watch"),
      training_frequency: fd.get("training_frequency"),
      sports: fd.getAll("sports"),
      apps_used: fd.getAll("apps_used"),
      main_goal: fd.get("main_goal"),
      source: fd.get("source"),
      locale: LANG + " | " + (navigator.language || ""),
      user_agent: navigator.userAgent
    };

    var r = await saveTester(payload);

    // Règle absolue : le testeur obtient TOUJOURS le lien TestFlight,
    // même si l'enregistrement a échoué (réseau, bloqueur de contenu…).
    if (r.ok) {
      track("beta_form_submitted", { watch: payload.has_apple_watch, goal: payload.main_goal, source: payload.source, lang: LANG });
    } else {
      track("beta_form_error", { detail: r.detail, lang: LANG });
    }
    document.getElementById("doneName").textContent = payload.first_name || "";
    form.style.display = "none";
    var done = document.getElementById("done");
    done.style.display = "block";
    done.scrollIntoView({behavior:"smooth", block:"center"});
  });

  document.getElementById("tfLink").addEventListener("click", function(){ track("testflight_click", {lang: LANG}); });
</script>
