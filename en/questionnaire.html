<title>Ecleptic — Your beta review</title>
<style>
  :root{--gold:#D9A441;--gold-soft:#B07A2A;--ink:#F2EBDD;--muted:#9A8E77;
        --bg:#0B0A08;--card:#161310;--line:#2A241B;color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:600px;margin:0 auto;padding:48px 24px 64px}
  .logo{font-size:14px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-weight:600;text-align:center}
  h1{font-size:clamp(26px,5vw,34px);text-align:center;margin:16px 0 8px}
  .sub{color:var(--muted);text-align:center;margin-bottom:32px}
  form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:left}
  .q{margin-bottom:22px}
  .q .title{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
  .q small{font-weight:400;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips input{position:absolute;opacity:0;pointer-events:none}
  .chips span{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
              background:var(--bg);font-size:14px;cursor:pointer;user-select:none}
  .chips input:checked + span{background:var(--gold);border-color:var(--gold);color:#1C1710;font-weight:600}
  input[type=email],textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
              font-size:16px;background:var(--bg);color:var(--ink);font-family:inherit}
  textarea{min-height:80px;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--gold-soft)}
  .cta{display:inline-block;border:0;cursor:pointer;width:100%;background:var(--gold);color:#1C1710;
       padding:16px;border-radius:14px;font-size:17px;font-weight:600;margin-top:4px}
  .err{display:none;color:#E07A50;font-size:14px;margin-top:10px;text-align:center}
  #done{display:none;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 28px;text-align:center}
  #done h2{margin-bottom:8px}
  #done p{color:var(--muted)}
</style>
<link rel="alternate" hreflang="fr" href="https://ecleptic.health/questionnaire.html">
<link rel="alternate" hreflang="en" href="https://ecleptic.health/en/questionnaire.html">
<link rel="alternate" hreflang="x-default" href="https://ecleptic.health/en/questionnaire.html">
<script>
(function(){try{
  var d=document.documentElement,page=d.lang,ls=window.localStorage,ua=navigator.userAgent||'';
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-setlang]');if(a){try{ls.setItem('ecleptic.lang',a.getAttribute('data-setlang'))}catch(_){}}});
  if(/bot|crawl|spider|slurp|google|bing|yandex|baidu|duckduck|facebook|whatsapp|telegram|twitter|linkedin|slack|discord|embed|preview|lighthouse|headless|pagespeed|gtmetrix|semrush|ahrefs|gpt|openai|oai-|perplexity|claude|anthropic|ccbot|applebot|amazonbot|bytespider|petal|mistral|cohere/i.test(ua))return;
  var m=location.search.match(/[?&]lang=(fr|en)\b/),want=m?m[1]:null;
  if(want){try{ls.setItem('ecleptic.lang',want)}catch(_){}}
  if(!want){try{want=ls.getItem('ecleptic.lang')}catch(_){}}
  if(!want){
    var langs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']);
    var tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(_){}
    want=(/^fr\b/i.test(langs[0]||'')||['Europe/Paris','Europe/Monaco','America/Martinique','America/Guadeloupe','America/Cayenne','America/St_Barthelemy','America/Marigot','America/Miquelon','Indian/Reunion','Indian/Mayotte','Pacific/Noumea','Pacific/Tahiti','Pacific/Marquesas','Pacific/Gambier','Pacific/Wallis','Indian/Kerguelen','Africa/Casablanca','Africa/El_Aaiun','Africa/Algiers','Africa/Tunis','Africa/Abidjan','Africa/Dakar','Africa/Bamako','Africa/Ouagadougou','Africa/Niamey','Africa/Conakry','Africa/Lome','Africa/Porto-Novo','Africa/Douala','Africa/Libreville','Africa/Brazzaville','Africa/Kinshasa','Africa/Lubumbashi','Africa/Bangui','Africa/Ndjamena','Africa/Nouakchott','Africa/Djibouti','Africa/Kigali','Africa/Bujumbura','Indian/Antananarivo','Indian/Comoro','Indian/Mahe','Indian/Mauritius','America/Port-au-Prince'].indexOf(tz)>=0)?'fr':'en';
  }
  if(want===page)return;
  var alt=document.querySelector('link[rel="alternate"][hreflang="'+want+'"]');
  if(!alt)return;
  var q=location.search.replace(/([?&])lang=(fr|en)\b&?/,'$1').replace(/[?&]$/,'');
  location.replace(alt.href+q+location.hash);
}catch(e){}})();
</script>
</head>
<body>
<div class="wrap">
  <div class="logo">Ecleptic</div>
  <h1>Your beta review ✦</h1>
  <p class="sub">2 minutes. Your answers directly shape what we build next.</p>

  <form id="survey">
    <div class="q">
      <label class="title">Overall, did you like the app? <small>(1 = not at all, 10 = loved it)</small></label>
      <div class="chips" id="satisfaction"></div>
    </div>

    <div class="q">
      <label class="title">Would you recommend it to a friend who trains? <small>(0 = never, 10 = definitely)</small></label>
      <div class="chips" id="nps"></div>
    </div>

    <div class="q">
      <label class="title">How often did you use it?</label>
      <div class="chips">
        <label><input type="radio" name="usage_frequency" value="daily" required><span>Every day</span></label>
        <label><input type="radio" name="usage_frequency" value="several_week"><span>Several times a week</span></label>
        <label><input type="radio" name="usage_frequency" value="rarely"><span>Rarely</span></label>
      </div>
    </div>

    <div class="q">
      <label class="title">What you liked most <small>(select all that apply)</small></label>
      <div class="chips">
        <label><input type="checkbox" name="favorite_features" value="scan_repas"><span>Meal scan</span></label>
        <label><input type="checkbox" name="favorite_features" value="sommeil"><span>Sleep tracking</span></label>
        <label><input type="checkbox" name="favorite_features" value="score_athlete"><span>Athlete score</span></label>
        <label><input type="checkbox" name="favorite_features" value="readiness"><span>Readiness</span></label>
        <label><input type="checkbox" name="favorite_features" value="labo"><span>The Lab</span></label>
        <label><input type="checkbox" name="favorite_features" value="coach_ia"><span>AI Coach</span></label>
        <label><input type="checkbox" name="favorite_features" value="age_bio"><span>Biological age</span></label>
        <label><input type="checkbox" name="favorite_features" value="design"><span>The design</span></label>
      </div>
    </div>

    <div class="q">
      <label class="title">What we should improve first <small>(select all that apply)</small></label>
      <div class="chips">
        <label><input type="checkbox" name="improve_areas" value="scan_precision"><span>Scan accuracy</span></label>
        <label><input type="checkbox" name="improve_areas" value="labo_ui"><span>Lab interface</span></label>
        <label><input type="checkbox" name="improve_areas" value="sommeil"><span>Sleep</span></label>
        <label><input type="checkbox" name="improve_areas" value="sport"><span>Training / workouts</span></label>
        <label><input type="checkbox" name="improve_areas" value="coach"><span>AI Coach</span></label>
        <label><input type="checkbox" name="improve_areas" value="stabilite"><span>Stability / speed</span></label>
        <label><input type="checkbox" name="improve_areas" value="onboarding"><span>Getting started</span></label>
        <label><input type="checkbox" name="improve_areas" value="design"><span>Overall design</span></label>
      </div>
    </div>

    <div class="q">
      <label class="title">What's missing? <small>(open-ended, optional)</small></label>
      <textarea name="missing_feature" placeholder="The feature that would make you stay…"></textarea>
    </div>

    <div class="q">
      <label class="title">At €12.99/month (or €89.99/year), would you subscribe?</label>
      <div class="chips">
        <label><input type="radio" name="would_pay" value="oui" required><span>Yes</span></label>
        <label><input type="radio" name="would_pay" value="peut_etre"><span>Maybe</span></label>
        <label><input type="radio" name="would_pay" value="non"><span>No</span></label>
      </div>
    </div>

    <div class="q">
      <label class="title">Your email <small>(the one you used for the beta, so we can link your answers)</small></label>
      <input type="email" name="email" autocomplete="email" placeholder="optional">
    </div>

    <!-- Anti-spam : champ invisible, seuls les robots le remplissent. -->
    <div aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="cta" id="btn" type="submit">Send my review</button>
    <p class="err" id="err">Sending failed — try again, or email us at contact@ecleptic.app</p>
  </form>

  <div id="done">
    <h2>Thank you ✦</h2>
    <p>Your review came through. It counts, literally: every answer carries weight in what we build next. Everything aligns.</p>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://avbmycfngmxhkjesdiyq.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2Ym15Y2ZuZ214aGtqZXNkaXlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzQ1OTksImV4cCI6MjA5OTI1MDU5OX0.uPvzmY5zV9e78ATohW4VyAwrYRKP33VphOhyFDe6GbI";

  // Échelles 1-10 / 0-10 générées
  function scale(el, name, from, to){
    for (var i=from; i<=to; i++){
      var l=document.createElement('label');
      l.innerHTML='<input type="radio" name="'+name+'" value="'+i+'" required><span>'+i+'</span>';
      el.appendChild(l);
    }
  }
  scale(document.getElementById('satisfaction'),'satisfaction',1,10);
  scale(document.getElementById('nps'),'nps',0,10);

  document.getElementById("survey").addEventListener("submit", async function(e){
    e.preventDefault();
    var btn=document.getElementById("btn"), err=document.getElementById("err");
    btn.disabled=true; btn.textContent="One moment…"; err.style.display="none";
    var fd=new FormData(e.target);
    if(fd.get("website")){ btn.textContent="Thanks!"; return; }
    var payload={
      satisfaction:+fd.get("satisfaction"), nps:+fd.get("nps"),
      usage_frequency:fd.get("usage_frequency"),
      favorite_features:fd.getAll("favorite_features"),
      improve_areas:fd.getAll("improve_areas"),
      missing_feature:(fd.get("missing_feature")||"").trim()||null,
      would_pay:fd.get("would_pay"),
      email:(fd.get("email")||"").trim().toLowerCase()||null,
      locale:navigator.language||null, user_agent:navigator.userAgent
    };
    var ok=false;
    try{
      var r=await fetch(SUPABASE_URL+"/rest/v1/beta_survey",{method:"POST",
        headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,
                 "Authorization":"Bearer "+SUPABASE_ANON_KEY,"Prefer":"return=minimal"},
        body:JSON.stringify(payload)});
      ok=r.ok||r.status===409;
    }catch(_){}
    if(ok){
      document.getElementById("survey").style.display="none";
      var d=document.getElementById("done"); d.style.display="block";
      d.scrollIntoView({behavior:"smooth",block:"center"});
    }else{
      err.style.display="block"; btn.disabled=false; btn.textContent="Send my review";
    }
  });
</script>
</body>
</html>
